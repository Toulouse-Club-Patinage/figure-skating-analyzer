server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anti-framing (clickjacking) : la page de consentement /autorisation est
    # servie par le fallback SPA ci-dessous. Ces en-têtes ne sont PAS hérités par
    # les locations qui déclarent leur propre add_header (nginx : dès qu'une
    # location a un add_header, elle n'hérite plus de ceux du server{}) — ils
    # sont donc répétés explicitement dans "location /".
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP (Streamable HTTP) — réponses potentiellement longues, pas de buffering
    location = /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serveur d'autorisation OAuth (endpoints à la racine, cf. RFC 8414)
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth- {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
